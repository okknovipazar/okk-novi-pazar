
name: RKSCS automatski rezultati

on:
  workflow_dispatch:
  schedule:
    - cron: '35 * * * *'

permissions:
  contents: write

jobs:
  rezultati:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi projekat
        uses: actions/checkout@v4

      - name: Podesi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instaliraj biblioteke
        run: pip install requests beautifulsoup4

      - name: Preuzmi rezultate RKSCS
        run: python scripts/rkscs_rezultati.py

      - name: Sacuvaj rezultate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rkscs_rezultati.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatsko azuriranje rezultata"
            git push
          fi
