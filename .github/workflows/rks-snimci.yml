name: RKS snimci utakmica

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4,10,16,22 * * *'

permissions:
  contents: write

jobs:
  snimci:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi projekat
        uses: actions/checkout@v4

      - name: Podesi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Proveri RKS Centralna Srbija snimke
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/rks_snimci.py

      - name: Sacuvaj video arhivu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rks-snimci.json
          if ! git diff --cached --quiet; then
            git commit -m "Osvezi RKS snimke Novog Pazara"
            git push
          fi
