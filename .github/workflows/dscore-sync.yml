
name: DScore automatski video

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi projekat
        uses: actions/checkout@v4

      - name: Podesi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test YouTube API kljuca
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.parse
          import urllib.request
          import urllib.error

          key = os.environ.get("YOUTUBE_API_KEY")
          if not key:
              raise SystemExit("API kljuc nije prosledjen.")

          params = urllib.parse.urlencode({
              "part": "snippet",
              "id": "UCCowik_MtwVKfLBrkxG5YvQ",
              "key": key
          })

          url = "https://www.googleapis.com/youtube/v3/channels?" + params

          try:
              with urllib.request.urlopen(url, timeout=20) as r:
                  data = json.load(r)
          except urllib.error.HTTPError as e:
              raise SystemExit(f"YouTube API greska: HTTP {e.code}")

          if not data.get("items"):
              raise SystemExit("Kanal nije pronadjen.")

          print("YouTube API radi!")
          print("Kanal:", data["items"][0]["snippet"]["title"])
          PY

      - name: Proveri DIGITAL Score TV
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/dscore_sync.py

      - name: Sacuvaj novi video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last-video.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatsko azuriranje DScore videa"
            git push
          fi
