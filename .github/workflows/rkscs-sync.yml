
name: RKSCS automatska tabela

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi projekat
        uses: actions/checkout@v4

      - name: Podesi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instaliraj biblioteke
        run: pip install requests beautifulsoup4

      - name: Preuzmi tabelu RKSCS
        run: python scripts/rkscs_sync.py

      - name: Sacuvaj nove podatke
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rkscs.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatsko azuriranje RKSCS tabele"
            git push
          fi
